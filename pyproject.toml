[project]
name = "rarbgenc"
version = "1.0.0"
description = "Desktop encoder that produces x264 MP4 files with the same 2-pass settings RARBG used"
readme = "README.md"
authors = [
    { name = "workingdad365", email = "workingdad365@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pyside6>=6.11.2",
    "static-ffmpeg>=3.0",
]

[project.scripts]
rarbgenc = "rarbgenc:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
